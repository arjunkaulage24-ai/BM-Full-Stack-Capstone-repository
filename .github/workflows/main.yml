name: Linting Python and JavaScript
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 server/djangoapp --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 server/djangoapp --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install JSHint
        run: npm install -g jshint

      - name: Lint JavaScript with JSHint
        run: jshint server/database/app.js --config .jshintrc
